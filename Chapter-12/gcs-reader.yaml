
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gcs-reader-ksa
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcs-reader
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gcs-reader
  template:
    metadata:
      labels:
        app: gcs-reader
    spec:
      serviceAccountName: gcs-reader-ksa
      containers:
        - name: gcs-reader
          image: google/cloud-sdk:slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              gcloud storage cp \
                gs://gcs-bhoopesh-demo/sample_data.txt \
                /tmp/sample_data.txt
              echo "===== sample_data.txt ====="
              cat /tmp/sample_data.txt
              echo "===== End of file ====="
              sleep 3600
