apiVersion: v1
kind: Namespace
metadata:
  name: sampledemo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sampledemo-config
  namespace: sampledemo
data:
  PHOENIX_PROJECT: test-eval
  PHOENIX_COLLECTOR_ENDPOINT: http://136.80.194.201:4317
  PHOENIX_BATCH_EXPORT: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sampledemo-streamlit
  namespace: sampledemo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sampledemo-streamlit
  template:
    metadata:
      labels:
        app: sampledemo-streamlit
    spec:
      containers:
        - name: app
          image: gcr.io/scalkit/sampledemo-streamlit:20261111
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8501
          envFrom:
            - configMapRef:
                name: sampledemo-config
            - secretRef:
                name: sampledemo-secrets
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sampledemo-streamlit
  namespace: sampledemo
spec:
  type: LoadBalancer
  selector:
    app: sampledemo-streamlit
  ports:
    - name: http
      port: 80
      targetPort: http
